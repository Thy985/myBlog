# 最小化启动配置 - 跳过外部依赖
spring:
  config:
    activate:
      on-profile: minimal

  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/myblog?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: 147258369Thy@
      database: 0

  # 禁用 RabbitMQ
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# 禁用向量服务
qdrant:
  enabled: false

opensearch:
  enabled: false

# 禁用 AI 嵌入（避免加载向量服务）
langchain4j:
  embeddings:
    enabled: false

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: INFO
    com.xingchen.backend: DEBUG
