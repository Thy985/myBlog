# PostgreSQL 向量数据库配置
spring:
  datasource:
    postgresql:
      url: jdbc:postgresql://localhost:5432/myblog
      username: admin
      password: admin123
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000

# AI 模型配置
ai:
  models:
    default: glm-4-flash
    fallback: glm-4-air
    premium: glm-4-plus
  params:
    default:
      temperature: 0.7
      max-tokens: 4096
    code:
      temperature: 0.2
    creative:
      temperature: 0.8

# Tavily 搜索 API（用于智能体联网搜索）
tavily:
  api:
    key: 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

glm:
  api:
    base-url: https://open.bigmodel.cn/api/paas/v4
    key: ${GLM_API_KEY:}

# 日志配置（开发环境DEBUG级别）
logging:
  level:
    root: INFO
    com.xingchen.backend: DEBUG
    com.alibaba.druid: DEBUG
    com.xingchen.backend.util.AesUtil: DEBUG

# MCP 服务配置
mcp:
  enabled: true
  whisper:
    url: http://localhost:8001
  vision:
    url: http://localhost:8002
  timeout: 30000
  health-check-interval: 60000

# 图片服务配置
image:
  unsplash:
    access-key: ${UNSPLASH_ACCESS_KEY:}
  service:
    enabled: true

# 飞书机器人配置（开发环境启用）
