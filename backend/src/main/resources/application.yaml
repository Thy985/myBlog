server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend
  profiles:
    active: dev

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:100MB}
    encoding:
      enabled: true
      charset: UTF-8
      force: true
      force-request: true
      force-response: true

  task:
    scheduling:
      enabled: true

# 日志配置
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.xingchen.backend: ${LOG_LEVEL_APP:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %replace(%msg){'password=[^\\s]*', 'password=***'}%n"
  sensitive-fields: password,token,secret,key,creditCard,phone,email

# MyBatis-Flex配置
mybatis-flex:
  type-aliases-package: com.xingchen.backend.entity
  mapper-locations: classpath*:/mapper/**/*.xml
  mapper-package: com.xingchen.backend.mapper
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: false
    multiple-result-sets-enabled: true
    use-column-label: true
    use-generated-keys: true
    auto-mapping-behavior: partial
    default-executor-type: simple
    default-statement-timeout: 25000
    default-fetch-size: 100
    safe-row-bounds-enabled: false
    local-cache-scope: session
    jdbc-type-for-null: other
    lazy-load-trigger-methods: "equals,clone,hashCode,toString"
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"
      insert-strategy: not_null
      update-strategy: not_null
      where-strategy: not_null

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:./uploads}
    # 存储类型: local 或 minio
    type: ${FILE_STORAGE_TYPE:minio}
  access:
    url: ${FILE_ACCESS_URL:/uploads}
  # MinIO 对象存储配置
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:myblog}
    # 是否启用 HTTPS（默认 false）
    secure: ${MINIO_SECURE:false}

# AI 多模型配置
ai:
  models:
    default: glm-4-flash
    fallback: glm-4-air
    premium: glm-4-plus
  params:
    default:
      temperature: 0.7
      max-tokens: 4096
    code:
      temperature: 0.2
    creative:
      temperature: 0.8
  token:
    budget: 8000
    alert:
      daily-threshold: 10000    # 日 Token 消耗告警阈值
      hourly-threshold: 2000    # 小时 Token 消耗告警阈值
    daily-budget: 50000              # 日 Token 预算上限
  system:
    prompt: "你是一个智能助手，帮助用户完成各种任务。"
  cache:
    enabled: true
  
  # AI智能体V2配置
  agent:
    security:
      max-input-length: 4000          # 最大输入长度
      enable-prompt-injection-check: true  # 启用Prompt注入检测
      enable-sensitive-word-check: true    # 启用敏感词检测
    memory:
      max-working-memory: 50          # 工作记忆最大条数
      max-short-term-rounds: 100      # 短期记忆最大轮数
      working-ttl-minutes: 30         # 工作记忆TTL
      short-term-ttl-days: 7          # 短期记忆TTL
    intent:
      regex-threshold: 0.8            # 正则匹配阈值
      embedding-threshold: 0.75       # Embedding匹配阈值
    llm:
      timeout-seconds: 60             # LLM调用超时
      max-retries: 3                  # 最大重试次数
      model-chain:                    # 模型降级链
        - openai/gpt-4
        - anthropic/claude-3-opus
        - openai/gpt-4-turbo
        - anthropic/claude-3-sonnet
        - openai/gpt-3.5-turbo

# 模型缓存配置（Caffeine）
model:
  cache:
    ttl: 30
    max-size: 100

# ============================================
# LLM Provider配置
# 只需配置你实际使用的Provider即可
# 系统会自动检测并启用已配置的Provider
# ============================================

# 方案1: 智谱AI (GLM) - 推荐国内使用
# 获取API Key: https://open.bigmodel.cn/
glm:
  api:
    key: ${GLM_API_KEY:}
    base-url: ${GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    model: ${GLM_MODEL:glm-4-flash}

# 方案2: OpenAI官方API
# 获取API Key: https://platform.openai.com/api-keys
openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-3.5-turbo}

# 方案3: 百度文心一言
# 获取API Key: https://cloud.baidu.com/doc/WENXINWORKSHOP/index.html
baidu:
  wenxin:
    api-key: ${BAIDU_API_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}
    model: ${BAIDU_MODEL:ernie-bot-4}

# 方案4: 本地模型 (Ollama)
# 安装Ollama: https://ollama.com/
# 启动: ollama serve
# 拉取模型: ollama pull llama2
ollama:
  enabled: ${OLLAMA_ENABLED:false}
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama2}

# 方案5: OpenRouter (可选)
# 获取API Key: https://openrouter.ai/keys
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  default-model: ${OPENROUTER_DEFAULT_MODEL:openai/gpt-3.5-turbo}
  timeout: ${OPENROUTER_TIMEOUT:60}

# 加密配置
encryption:
  master-key: ${ENCRYPTION_MASTER_KEY:myblog-secret-key-2024-encryption-fixed}

# Resilience4j 熔断配置
resilience4j:
  circuitbreaker:
    configs:
      default:
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10s
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowSize: 100
        minimumNumberOfCalls: 10
        waitDurationInOpenState: 30s
    instances:
      aiChat:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
      aiChatContext:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      aiChatRag:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      aiStream:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      # AI智能体V2熔断器
      OpenRouter:
        slidingWindowSize: 50
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slowCallDurationThreshold: 10s
  ratelimiter:
    configs:
      default:
        limitForPeriod: 60
        limitRefreshPeriod: 1m
        timeoutDuration: 100ms
    instances:
      ai-user:
        limitForPeriod: 60
        limitRefreshPeriod: 1m
        timeoutDuration: 100ms
      ai-global:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 100ms
  retry:
    instances:
      aiChat:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,ratelimiters
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,5s
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
    mail:
      enabled: false

# 飞书机器人配置（长连接 WebSocket 模式）
feishu:
  bot:
    enabled: ${FEISHU_BOT_ENABLED:false}
    app-id: ${FEISHU_APP_ID:}
    app-secret: ${FEISHU_APP_SECRET:}

# Agent 工作目录
agent:
  workspace: ${AGENT_WORKSPACE:./data/agent}
  memory:
    max-rounds: ${AGENT_MEMORY_MAX_ROUNDS:50}

