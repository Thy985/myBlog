          example: 200
        message:
          type: string
          example: success
        data:
          type: object

    ArticleCreate:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        description:
          type: string
        titleImage:
          type: string
        categoryId:
          type: integer
        tagIds:
          type: array
          items:
            type: integer
        status:
          type: integer
        commentStatus:
          type: integer
        viewStatus:
          type: integer
