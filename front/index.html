<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="XingChen 博客 - 分享技术文章和个人见解">
    <meta name="keywords" content="博客,技术,前端,后端,编程">
    <meta name="author" content="XingChen">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#3b82f6">
    <meta name="color-scheme" content="light dark">

    <!-- Resource Hints: 减少 DNS 解析和连接建立时间 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- PWA -->
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.json">

    <title>XingChen 博客</title>
    <style>
      /* 预加载样式 - 确保全屏显示 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow-x: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f9fafb;
        color: #1e293b;
      }

      /* 深色模式预加载样式 */
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #111113;
          color: #f1f5f9;
        }
      }

      /* 加载动画 */
      #app {
        width: 100%;
        min-height: 100vh;
      }

      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-size: 18px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">加载中...</div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <noscript>
      <div style="padding: 20px; text-align: center;">
        <h2>请启用JavaScript以获得最佳体验</h2>
        <p>本网站需要JavaScript来提供完整的功能。</p>
      </div>
    </noscript>
  </body>
</html>
