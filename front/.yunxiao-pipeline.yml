version: 1.0

name: Frontend Pipeline

# 流水线触发条件
trigger:
  branches:
    - main
    - develop
    - feature/*

# 流水线阶段
stages:
  # 代码扫描阶段
  - name: code-scan
    steps:
      - name: JavaScriptCodeScan
        version: v1.0.45
        # 增加 Node.js 内存限制，解决内存溢出问题
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        config:
          # 扫描配置
          scan_paths:
            - src/
          # 排除路径
          exclude_paths:
            - node_modules/
            - dist/
            - build/
            - "*.config.js"
            - auto-imports.d.ts
            - components.d.ts
            - src/tests/
            - src/assets/
            - src/plugins/
            - src/types/
            - src/constants/

  # 构建阶段
  - name: build
    steps:
      - name: Command
        version: v1.0.74
        script: |
          # 安装依赖
          npm install
          
          # 运行 ESLint 检查（带内存限制）
          export NODE_OPTIONS="--max-old-space-size=6144"
          npm run lint || true
          
          # 构建项目
          npm run build
        
  # 测试阶段（可选）
  - name: test
    steps:
      - name: Command
        version: v1.0.74
        script: |
          # 运行测试
          npm run test || echo "No tests configured"
